<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Qualimpel — Sistema de Gestão Industrial</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --nav:#0f1923;--accent:#38bdf8;--accent2:#f97316;--accent3:#22c55e;
  --bg:#f0f2f5;--card:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;
  --surface:#f9fafb;--font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --sidebar-w:220px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
button{cursor:pointer;font-family:var(--font);}
input,select,textarea{font-family:var(--font);}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:99px}

/* ── LOGIN ───────────────────────────────────────────────────────────────── */
#screen-login{display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--nav);}
#screen-login.active{display:flex}
.login-box{background:#1a2535;border:1px solid #2d3f52;border-radius:12px;padding:40px;width:360px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h1{color:#fff;font-size:22px;font-weight:600;letter-spacing:.05em;}
.login-logo span{color:var(--accent);font-size:12px;letter-spacing:.1em;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.login-field input{width:100%;background:#0f1923;border:1px solid #2d3f52;border-radius:8px;padding:10px 14px;color:#fff;font-size:14px;}
.login-field input:focus{outline:none;border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#0f1923;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;margin-top:8px;}
.login-btn:hover{opacity:.88}
.login-error{background:#7f1d1d;color:#fca5a5;padding:10px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none;}

/* ── APP SHELL ───────────────────────────────────────────────────────────── */
#screen-app{display:none;height:100vh;flex-direction:row;}
#screen-app.active{display:flex}

/* Sidebar */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;background:var(--nav);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-logo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;min-height:52px;}
.sidebar-logo-icon{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0f1923;flex-shrink:0;}
.sidebar-logo-text strong{font-size:13px;font-weight:600;color:#fff;display:block;}
.sidebar-logo-text span{font-size:10px;color:#64748b;letter-spacing:.3px;}
.sidebar-section{padding:14px 12px 4px;font-size:10px;font-weight:700;color:#334155;letter-spacing:1px;text-transform:uppercase;}
.sidebar-nav{flex:1;overflow-y:auto;padding-bottom:8px;}
.snav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;font-weight:500;color:#94a3b8;cursor:pointer;border-left:2px solid transparent;transition:all .15s;user-select:none;}
.snav:hover{background:rgba(255,255,255,.05);color:#fff;}
.snav.active{background:rgba(56,189,248,.1);color:var(--accent);border-left-color:var(--accent);}
.snav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.snav-sub{padding-left:30px;font-size:11px;}
.sidebar-user{border-top:1px solid rgba(255,255,255,.08);padding:10px 14px;display:flex;align-items:center;gap:9px;}
.sidebar-avatar{width:28px;height:28px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1923;flex-shrink:0;}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-info .sname{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-info .srole{font-size:10px;color:#64748b;}
.sidebar-logout{background:none;border:none;color:#475569;font-size:14px;padding:4px;border-radius:4px;}
.sidebar-logout:hover{color:#ef4444;}

/* Main */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.main-content{flex:1;overflow-y:auto;padding:24px;}

/* ── HOME CARDS ─────────────────────────────────────────────────────────── */
.home-greeting{margin-bottom:24px;}
.home-greeting h1{font-size:22px;font-weight:600;margin-bottom:4px;}
.home-greeting p{font-size:13px;color:var(--muted);}
.home-stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.home-stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.home-stat-card .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.home-stat-card .val{font-size:24px;font-weight:600;font-family:var(--mono);}
.home-stat-card .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.mod-card{border-radius:10px;padding:22px 18px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;border:1px solid transparent;}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.15);}
.mod-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 60%);pointer-events:none;}
.mod-card-icon{font-size:26px;margin-bottom:12px;display:block;}
.mod-card-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;}
.mod-card-desc{font-size:11px;color:rgba(255,255,255,.65);line-height:1.5;}
.card-pcm{background:linear-gradient(135deg,#1e3a5f,#2563eb);}
.card-pd{background:linear-gradient(135deg,#3b1f6a,#7c3aed);}
.card-prod{background:linear-gradient(135deg,#1a4731,#059669);}
.card-pcp{background:linear-gradient(135deg,#4a2010,#ea580c);}
.card-rh{background:linear-gradient(135deg,#4a1a3a,#db2777);}
.card-dem{background:linear-gradient(135deg,#1a3a4a,#0891b2);}
.card-log{background:linear-gradient(135deg,#3a3a10,#ca8a04);}
.card-adm{background:linear-gradient(135deg,#1e293b,#374151);}

/* ── PCM — componentes idênticos ao original ─────────────────────────────── */
.pcm-wrap{display:flex;flex-direction:column;height:100%;min-height:0;}
.pcm-nav{background:var(--nav);display:flex;align-items:stretch;overflow-x:auto;flex-shrink:0;height:48px;}
.pcm-logo{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid rgba(255,255,255,.08);}
.pcm-logo-t{color:#fff;font-size:12px;font-weight:600;letter-spacing:.05em;}
.pcm-logo-b{background:var(--accent);color:#0f1923;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;}
.pcm-btn{background:none;border:none;padding:0 14px;font-size:12px;font-weight:500;color:#94a3b8;display:flex;align-items:center;gap:5px;border-bottom:2px solid transparent;height:100%;white-space:nowrap;transition:all .15s;}
.pcm-btn:hover{color:#fff;background:rgba(255,255,255,.05);}
.pcm-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.pcm-spacer{flex:1;}
.pcm-user{display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid rgba(255,255,255,.08);}
.pcm-user-name{color:#cbd5e1;font-size:12px;}
.pcm-inner{flex:1;overflow-y:auto;padding:20px;background:var(--bg);}
.pcm-screen{display:none;}
.pcm-screen.active{display:block;}

/* PCM componentes */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.page-title{font-size:17px;font-weight:600;}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.btn{border:none;cursor:pointer;font-family:var(--font);font-weight:500;border-radius:8px;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn-p{background:var(--accent);color:#0f1923;font-size:13px;padding:8px 16px;}
.btn-p:hover{opacity:.88}
.btn-s{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;padding:8px 14px;}
.btn-s:hover{background:var(--surface);}
.btn-sm{font-size:12px;padding:5px 10px;}
.btn-danger{background:#fee2e2;color:#991b1b;border:none;}
.btn-danger:hover{background:#fecaca;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden;}
.mc-accent{position:absolute;top:0;left:0;width:3px;height:100%;}
.mc-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.mc-val{font-size:24px;font-weight:600;font-family:var(--mono);line-height:1;}
.mc-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:600;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 14px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--surface);}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface);}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.bg{background:#dcfce7;color:#14532d;}.ba{background:#fef3c7;color:#78350f;}.br{background:#fee2e2;color:#7f1d1d;}
.bb{background:#dbeafe;color:#1e3a5f;}.bp{background:#ede9fe;color:#3b0764;}.bgy{background:var(--surface);color:var(--muted);}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1;min-width:160px;}
.search-wrap input{padding-left:30px;}
.search-wrap::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .12s;}
.chip.active{background:var(--accent);color:#0f1923;border-color:var(--accent);}
.chip:hover:not(.active){border-color:var(--accent);color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.timeline-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.tl-title{font-size:13px;font-weight:500;}
.tl-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.equip-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.equip-card-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;}
.equip-avatar{width:34px;height:34px;border-radius:7px;background:var(--nav);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}

/* Modal PCM */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-ov.open{display:flex;}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--border);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;}
.modal-title{font-size:14px;font-weight:600;}
.close-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;}
.modal-ftr{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--card);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.form-grid.g1{grid-template-columns:1fr;}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
input,select,textarea{font-family:var(--font);font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.15);}
textarea{resize:vertical;min-height:65px;}

/* Toast */
.toast{position:fixed;bottom:18px;right:18px;background:#0f1923;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:2000;display:none;align-items:center;gap:8px;border:1px solid #2d3f52;}
.toast.show{display:flex;}
.loading{text-align:center;padding:36px;color:var(--muted);font-size:13px;}
.empty{text-align:center;padding:36px;color:var(--muted);}

/* Admin usuários */
.admin-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.admin-search{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;}
.admin-search input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 12px;font-size:13px;outline:none;}
.admin-search input:focus{border-color:var(--accent);}
.mod-pills{display:flex;flex-wrap:wrap;gap:3px;}
.mpill{padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;background:#dbeafe;color:#1e3a5f;}
/* Permissões modal */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px;}
.perm-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;}
.perm-left{display:flex;align-items:center;gap:8px;}
.toggle{position:relative;width:34px;height:18px;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.slider{position:absolute;inset:0;background:#d1d5db;border-radius:99px;cursor:pointer;transition:.2s;}
.toggle input:checked+.slider{background:var(--accent);}
.slider::after{content:'';position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;}
.toggle input:checked+.slider::after{transform:translateX(16px);}
.perm-label{font-size:12px;font-weight:500;}
.perm-role{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-size:11px;outline:none;color:var(--text);}
.perm-role:focus{border-color:var(--accent);}

/* Conta modal */
.conta-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.conta-modal.open{display:flex;}

/* Módulo placeholder */
.mod-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;text-align:center;}
.mod-placeholder-icon{font-size:52px;margin-bottom:14px;opacity:.5;}
.mod-placeholder h2{font-size:18px;font-weight:600;margin-bottom:8px;}
.mod-placeholder p{font-size:13px;color:var(--muted);max-width:340px;line-height:1.6;}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="screen-login" class="active">
  <div class="login-box">
    <div class="login-logo">
      <h1>Q QUALIMPEL</h1>
      <span>SISTEMA DE GESTÃO INDUSTRIAL</span>
    </div>
    <div class="login-error" id="login-error"></div>
    <div class="login-field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"/></div>
    <div class="login-field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"/></div>
    <button class="login-btn" id="btn-login" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="screen-app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">Q</div>
      <div class="sidebar-logo-text"><strong>QUALIMPEL</strong><span>Gestão Industrial</span></div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sb-avatar"></div>
      <div class="sidebar-user-info">
        <div class="sname" id="sb-nome">—</div>
        <div class="srole" id="sb-role">—</div>
      </div>
      <button class="sidebar-logout" title="Sair" onclick="doLogout()">⏻</button>
    </div>
  </aside>
  <div class="main-area">
    <div class="main-content" id="main-content"></div>
  </div>
</div>

<!-- MODAL CONTA -->
<div class="conta-modal" id="modal-conta">
  <div class="modal" style="max-width:420px">
    <div class="modal-hdr"><span class="modal-title">⚙ Minha Conta</span><button class="close-btn" onclick="closeConta()">×</button></div>
    <div style="padding:16px;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
        <div id="conta-avatar" style="width:44px;height:44px;border-radius:50%;background:var(--nav);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);flex-shrink:0;"></div>
        <div><div id="conta-nome" style="font-size:15px;font-weight:600;"></div><div id="conta-email" style="font-size:12px;color:var(--muted);"></div></div>
      </div>
    </div>
    <div style="padding:16px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:12px;">Alterar Senha</div>
      <div class="form-grid g1" style="padding:0;gap:10px;">
        <div class="field"><label>Senha Atual</label><input type="password" id="cp-atual"/></div>
        <div class="field"><label>Nova Senha</label><input type="password" id="cp-nova"/></div>
        <div class="field"><label>Confirmar Nova Senha</label><input type="password" id="cp-conf"/></div>
      </div>
    </div>
    <div class="modal-ftr"><button class="btn btn-s" onclick="closeConta()">Fechar</button><button class="btn btn-p" onclick="changePassword()">Salvar Nova Senha</button></div>
  </div>
</div>

<!-- MODAL CONFIRMAR -->
<div class="modal-ov" id="modal-confirm">
  <div class="modal" style="max-width:380px">
    <div class="modal-hdr"><span class="modal-title" id="confirm-title">Confirmar</span><button class="close-btn" onclick="closeModal('modal-confirm')">×</button></div>
    <div style="padding:16px;font-size:13px;color:var(--muted);" id="confirm-text"></div>
    <div class="modal-ftr"><button class="btn btn-s" onclick="closeModal('modal-confirm')">Cancelar</button><button class="btn btn-danger" id="confirm-ok">Confirmar</button></div>
  </div>
</div>

<!-- MODAL USUÁRIO ADMIN -->
<div class="modal-ov" id="modal-user">
  <div class="modal" style="max-width:680px">
    <div class="modal-hdr"><span class="modal-title" id="modal-user-title">Novo Usuário</span><button class="close-btn" onclick="closeModal('modal-user')">×</button></div>
    <input type="hidden" id="u-id"/>
    <div class="form-grid">
      <div class="field full"><label>Nome completo</label><input id="u-nome"/></div>
      <div class="field"><label>E-mail</label><input type="email" id="u-email"/></div>
      <div class="field"><label>Senha <span id="u-senha-hint" style="text-transform:none;font-weight:400;font-size:10px;color:var(--muted)">(vazio = manter)</span></label><input type="password" id="u-senha" placeholder="Mínimo 6 caracteres"/></div>
      <div class="field"><label>Matrícula</label><input id="u-matricula"/></div>
      <div class="field"><label>Cargo</label><input id="u-cargo"/></div>
      <div class="field"><label>Telefone</label><input id="u-tel"/></div>
      <div class="field"><label>Perfil no portal</label><select id="u-role"><option value="usuario">Usuário</option><option value="admin">Administrador</option><option value="superadmin">Superadmin</option></select></div>
      <div class="field"><label>Status</label><select id="u-ativo"><option value="true">Ativo</option><option value="false">Inativo</option></select></div>
    </div>
    <div style="padding:0 16px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">🔐 Acesso aos Módulos</div>
    <div class="perm-grid" id="perm-grid"></div>
    <div class="modal-ftr"><button class="btn btn-s" onclick="closeModal('modal-user')">Cancelar</button><button class="btn btn-p" onclick="saveUser()">Salvar</button></div>

<!-- MODAL USUÁRIO ADMIN - editar usuário na lista do PCM não se aplica; colaboradores são do portal -->

<script>
/* ══════════════════════════════════════════════════════════════
   ESTADO GLOBAL
══════════════════════════════════════════════════════════════ */
const API = '';
let TOKEN = localStorage.getItem('qportal_token') || null;
let ME = null;
let USERS_CACHE = [];
let PCM_EQUIPS = []; // cache equipamentos PCM
let PCM_USERS  = []; // portal_users com acesso_pcm
let PCM_CHARTS = {};

const MODULES = [
  {key:'pcm',      label:'Manutenção', icon:'🔧', desc:'Ordens de serviço e planos preventivos', color:'card-pcm', acesso:'acesso_pcm'},
  {key:'pd',       label:'P&D',        icon:'🔬', desc:'Projetos e desenvolvimento de produtos',  color:'card-pd',  acesso:'acesso_pd'},
  {key:'producao', label:'Produção',   icon:'🏭', desc:'Controle de linhas e ordens de produção', color:'card-prod',acesso:'acesso_producao'},
  {key:'pcp',      label:'PCP',        icon:'📋', desc:'Planejamento e controle de produção',     color:'card-pcp', acesso:'acesso_pcp'},
  {key:'rh',       label:'RH',         icon:'👥', desc:'Colaboradores, ponto e folha salarial',   color:'card-rh',  acesso:'acesso_rh'},
  {key:'demandas', label:'Demandas',   icon:'📌', desc:'Gestão de tarefas e solicitações',        color:'card-dem', acesso:'acesso_demandas'},
  {key:'logistica',label:'Logística',  icon:'🚛', desc:'Carregamentos e programações',            color:'card-log', acesso:'acesso_logistica'},
];
const ROLE_LABELS = {superadmin:'Superadmin',admin:'Administrador',usuario:'Usuário',gestor:'Gestor',tecnico:'Técnico'};

/* ══════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════ */
function apiCall(path, opts={}) {
  const h = {'Content-Type':'application/json'};
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(API + path, {headers:h, ...opts});
}
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = (ok?'✓ ':'✗ ') + msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3200);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function openConta() { loadContaInfo(); document.getElementById('modal-conta').classList.add('open'); }
function closeConta() { document.getElementById('modal-conta').classList.remove('open'); }
function initials(n) { return (n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function fmtDate(d) { if(!d) return '—'; const [y,m,dd]=d.toString().slice(0,10).split('-'); return `${dd}/${m}/${y}`; }
function today() { return new Date().toISOString().slice(0,10); }
function confirmAction(title, text, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-text').textContent  = text;
  document.getElementById('confirm-ok').onclick = ()=>{ closeModal('modal-confirm'); onOk(); };
  openModal('modal-confirm');
}
document.querySelectorAll('.modal-ov').forEach(o => o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('open'); }));
document.getElementById('modal-conta').addEventListener('click', e=>{ if(e.target===document.getElementById('modal-conta')) closeConta(); });

/* ══════════════════════════════════════════════════════════════
   AUTH
══════════════════════════════════════════════════════════════ */
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const err   = document.getElementById('login-error');
  const btn   = document.getElementById('btn-login');
  err.style.display = 'none';
  if (!email||!senha) { err.textContent='Preencha e-mail e senha.'; err.style.display='block'; return; }
  btn.textContent='Entrando...'; btn.disabled=true;
  try {
    const body = new URLSearchParams({username:email, password:senha});
    const r = await fetch('/api/auth/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail||'E-mail ou senha incorretos.');
    TOKEN = data.access_token;
    localStorage.setItem('qportal_token', TOKEN);
    await loadMe();
    showApp();
  } catch(e) { err.textContent=e.message; err.style.display='block'; }
  finally { btn.textContent='Entrar'; btn.disabled=false; }
}
async function loadMe() {
  const r = await apiCall('/api/auth/me');
  if (!r.ok) { doLogout(); return; }
  ME = await r.json();
}
function doLogout() {
  TOKEN=null; ME=null;
  localStorage.removeItem('qportal_token');
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('login-senha').value='';
}

/* ══════════════════════════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════════════════════════ */
function showApp() {
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  document.getElementById('sb-avatar').textContent = initials(ME.nome);
  document.getElementById('sb-nome').textContent   = ME.nome.split(' ')[0];
  document.getElementById('sb-role').textContent   = ROLE_LABELS[ME.role_portal]||ME.role_portal;
  buildSidebar();
  navigateTo('home');
}

function buildSidebar(activePCMSub=null) {
  const isAdmin = ME.role_portal==='admin'||ME.role_portal==='superadmin';
  const myModules = MODULES.filter(m=>ME[m.acesso]);
  let html = `<div class="sidebar-section">Menu</div>`;
  html += snavItem('home','🏠','Início', 'home');
  if (myModules.length) {
    html += `<div class="sidebar-section">Módulos</div>`;
    myModules.forEach(m => {
      if (m.key==='pcm') {
        html += snavItem('pcm','🔧','Manutenção','pcm');
        if (activePCMSub) {
          html += snavItemSub('pcm-dash','📊','Dashboard',  ()=>pcmNav('dash',null),  activePCMSub==='dash');
          html += snavItemSub('pcm-os',  '📋','Ordens de Serviço', ()=>pcmNav('os',null),  activePCMSub==='os');
          html += snavItemSub('pcm-ag',  '🔁','Programação',  ()=>pcmNav('agenda',null), activePCMSub==='agenda');
          html += snavItemSub('pcm-eq',  '⚙️','Equipamentos', ()=>pcmNav('equip',null), activePCMSub==='equip');
          html += snavItemSub('pcm-rel', '📊','Relatórios',   ()=>pcmNav('rel',null),   activePCMSub==='rel');
          html += snavItemSub('pcm-cfg', '⚙','Configurações', ()=>pcmNav('config',null),activePCMSub==='config');
        }
      } else {
        html += snavItem(m.key, m.icon, m.label, m.key);
      }
    });
  }
  if (isAdmin) {
    html += `<div class="sidebar-section">Administração</div>`;
    html += snavItem('admin-users','👤','Usuários','admin-users');
  }
  html += `<div class="sidebar-section">Conta</div>`;
  html += `<div class="snav" onclick="openConta()"><span class="snav-icon">⚙️</span>Minha Conta</div>`;
  document.getElementById('sidebar-nav').innerHTML = html;
}

function snavItem(id, icon, label, navKey) {
  return `<div class="snav" id="snav-${id}" onclick="navigateTo('${navKey}')"><span class="snav-icon">${icon}</span>${label}</div>`;
}
function snavItemSub(id, icon, label, fn, active=false) {
  return `<div class="snav snav-sub${active?' active':''}" id="${id}" onclick="(${fn.toString()})()" ><span class="snav-icon" style="font-size:12px">${icon}</span>${label}</div>`;
}

function setActiveNav(id) {
  document.querySelectorAll('.snav').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('snav-'+id);
  if (el) el.classList.add('active');
}

function navigateTo(section) {
  if (section!=='pcm' && !section.startsWith('pcm-')) {
    buildSidebar(null);
  }
  setActiveNav(section);
  const mc = document.getElementById('main-content');
  mc.innerHTML = '<div class="loading">Carregando...</div>';
  switch(section) {
    case 'home':       renderHome();      break;
    case 'admin-users':renderAdminUsers();break;
    case 'pcm':        renderPCM();       break;
    default:           renderPlaceholder(section); break;
  }
}

/* ══════════════════════════════════════════════════════════════
   HOME
══════════════════════════════════════════════════════════════ */
async function renderHome() {
  const mc = document.getElementById('main-content');
  let stats = {};
  try { const r=await apiCall('/api/dashboard/stats'); if(r.ok) stats=await r.json(); } catch(e){}
  const myModules = MODULES.filter(m=>ME[m.acesso]);
  const h = new Date().getHours();
  const saudacao = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const isAdmin = ME.role_portal==='admin'||ME.role_portal==='superadmin';
  let html = `<div class="home-greeting"><h1>${saudacao}, ${ME.nome.split(' ')[0]}! 👋</h1><p>Em que módulo vamos trabalhar hoje?</p></div>`;
  if (isAdmin) {
    html += `<div class="home-stats-row">
      <div class="home-stat-card"><div class="lbl">Usuários ativos</div><div class="val">${stats.usuarios_ativos??'—'}</div><div class="sub">de ${stats.total_usuarios??'—'} cadastrados</div></div>
      <div class="home-stat-card"><div class="lbl">Administradores</div><div class="val">${stats.administradores??'—'}</div><div class="sub">com acesso total</div></div>
      <div class="home-stat-card"><div class="lbl">Módulos</div><div class="val">${myModules.length}</div><div class="sub">de ${MODULES.length} disponíveis</div></div>
    </div>`;
  }
  if (!myModules.length) {
    html += `<div class="mod-placeholder"><div class="mod-placeholder-icon">🔒</div><h2>Sem módulos liberados</h2><p>Você ainda não tem acesso a nenhum módulo. Solicite ao administrador.</p></div>`;
  } else {
    html += `<div class="modules-grid">`;
    myModules.forEach(m => {
      html += `<div class="mod-card ${m.color}" onclick="navigateTo('${m.key}')"><span class="mod-card-icon">${m.icon}</span><div class="mod-card-name">${m.label}</div><div class="mod-card-desc">${m.desc}</div></div>`;
    });
    if (isAdmin) html += `<div class="mod-card card-adm" onclick="navigateTo('admin-users')"><span class="mod-card-icon">⚙️</span><div class="mod-card-name">Administração</div><div class="mod-card-desc">Usuários e permissões do sistema</div></div>`;
    html += `</div>`;
  }
  mc.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   PLACEHOLDER
══════════════════════════════════════════════════════════════ */
function renderPlaceholder(key) {
  const m = MODULES.find(x=>x.key===key);
  document.getElementById('main-content').innerHTML = `<div class="mod-placeholder"><div class="mod-placeholder-icon">${m?m.icon:'📦'}</div><h2>${m?m.label:key} — Em breve</h2><p>Este módulo está sendo integrado ao portal.</p></div>`;
}

/* ══════════════════════════════════════════════════════════════
   PCM — MANUTENÇÃO (idêntico ao sistema original)
══════════════════════════════════════════════════════════════ */
async function renderPCM() {
  buildSidebar('dash');
  setActiveNav('pcm');
  const mc = document.getElementById('main-content');
  // Carrega metadados
  await loadPCMMeta();
  // Monta estrutura HTML idêntica ao original
  mc.innerHTML = `
  <div class="pcm-wrap">
    <nav class="pcm-nav">
      <div class="pcm-logo"><span class="pcm-logo-t">PCM</span><span class="pcm-logo-b">v2</span></div>
      <button class="pcm-btn active" id="pcm-nav-dash"  onclick="pcmNav('dash',this)">▦ Dashboard</button>
      <button class="pcm-btn" id="pcm-nav-os"    onclick="pcmNav('os',this)">≡ Ordens de Serviço</button>
      <button class="pcm-btn" id="pcm-nav-agenda" onclick="pcmNav('agenda',this)">◫ Programação</button>
      <button class="pcm-btn" id="pcm-nav-equip" onclick="pcmNav('equip',this)">⊞ Equipamentos</button>
      <button class="pcm-btn" id="pcm-nav-rel"   onclick="pcmNav('rel',this)">⊟ Relatórios</button>
      <button class="pcm-btn" id="pcm-nav-config" onclick="pcmNav('config',this)">⚙ Configurações</button>
      <div class="pcm-spacer"></div>
      <div class="pcm-user"><span class="pcm-user-name">${ME.nome.split(' ')[0]}</span></div>
    </nav>
    <div class="pcm-inner" id="pcm-inner">
      <div class="pcm-screen active" id="pcm-s-dash"></div>
      <div class="pcm-screen" id="pcm-s-os"></div>
      <div class="pcm-screen" id="pcm-s-agenda"></div>
      <div class="pcm-screen" id="pcm-s-equip"></div>
      <div class="pcm-screen" id="pcm-s-rel"></div>
      <div class="pcm-screen" id="pcm-s-config"></div>
    </div>
  </div>`;
  pcmLoadDash();
}

function pcmNav(id, btn) {
  document.querySelectorAll('.pcm-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.pcm-screen').forEach(s=>s.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const b = document.getElementById('pcm-nav-'+id);
    if (b) b.classList.add('active');
  }
  const s = document.getElementById('pcm-s-'+id);
  if (s) { s.classList.add('active'); s.innerHTML='<div class="loading">Carregando...</div>'; }
  const subMap = {dash:'dash',os:'os',agenda:'agenda',equip:'equip',rel:'rel',config:'config'};
  buildSidebar(subMap[id]||id);
  const loaders = {dash:pcmLoadDash, os:pcmLoadOS, agenda:pcmLoadAgenda, equip:pcmLoadEquip, rel:pcmLoadRel, config:pcmLoadConfig};
  if (loaders[id]) loaders[id]();
}

async function loadPCMMeta() {
  try {
    const [eR, uR] = await Promise.all([apiCall('/api/pcm/equipamentos/'), apiCall('/api/users/')]);
    PCM_EQUIPS = eR.ok ? await eR.json() : [];
    const allU = uR.ok ? await uR.json() : [];
    PCM_USERS = allU.filter(u=>u.acesso_pcm && u.is_active);
  } catch(e){}
  fillPCMSelects();
}

function fillPCMSelects() {
  const eqOpts = '<option value="">— Selecionar —</option>' + PCM_EQUIPS.map(e=>`<option value="${e.id}">${e.nome} (${e.linha||'—'})</option>`).join('');
  const uOpts  = '<option value="">— Selecionar —</option>' + PCM_USERS.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
  ['os-equip','pr-equip'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=eqOpts; });
  ['os-resp','pr-resp'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=uOpts; });
  populateLinhasSelects();
}

// Badges idênticos ao original
function typeBadge(t) { const m={'Corretiva':'br','Preventiva':'bb','Preditiva':'bp','Melhoria':'bg'}; return `<span class="badge ${m[t]||'bgy'}">${t||'—'}</span>`; }
function statusBadge(s) { const m={'Concluída':'bg','concluida':'bg','Em andamento':'bb','em_andamento':'bb','Aberta':'ba','aberta':'ba','Aguardando peça':'br','Cancelada':'bgy','cancelada':'bgy'}; const l={'aberta':'Aberta','em_andamento':'Em andamento','concluida':'Concluída','cancelada':'Cancelada'}; return `<span class="badge ${m[s]||'bgy'}">${l[s]||s||'—'}</span>`; }
function critBadge(c) { const m={'Alta':'br','Média':'ba','Baixa':'bg','alta':'br','media':'ba','baixa':'bg'}; const l={'alta':'Alta','media':'Média','baixa':'Baixa'}; return `<span class="badge ${m[c]||'bgy'}">${l[c]||c||'—'}</span>`; }

/* PCM DASHBOARD */
async function pcmLoadDash() {
  const el = document.getElementById('pcm-s-dash'); if(!el) return;
  const [statsR, prevR] = await Promise.all([apiCall('/api/pcm/dashboard/stats'), apiCall('/api/pcm/dashboard/preventivas-vencidas')]);
  const d = statsR.ok ? await statsR.json() : {};
  const prev7 = prevR.ok ? await prevR.json() : [];

  const now = new Date();
  const mets = [
    ['Total OS', d.total_os??0, '#38bdf8', 'Todas as ordens'],
    ['Concluídas', d.os_concluidas??0, '#22c55e', d.total_os ? Math.round((d.os_concluidas??0)/(d.total_os)*100)+'% de conclusão' : '—'],
    ['Pendentes', d.os_abertas??0, '#f59e0b', 'Em aberto'],
    ['Em andamento', d.os_em_andamento??0, '#38bdf8', 'Em execução'],
    ['Tempo total', (d.mttr??0)+'h', '#f97316', 'MTTR médio'],
    ['Equipamentos', d.equipamentos_ativos??0, '#a78bfa', 'Cadastrados'],
    ['Corretivas', 0, '#ef4444', 'Manutenção reativa'],
    ['Prev. vencendo', d.preventivas_vencidas??0, '#f59e0b', 'Próximos 7 dias'],
  ];

  el.innerHTML = `
    <div class="page-hdr">
      <div><div class="page-title">Dashboard</div><div class="page-sub">Visão geral — ${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div></div>
      <button class="btn btn-p btn-sm" onclick="openPCMNovaOS()">+ Nova OS</button>
    </div>
    <div class="metrics">${mets.map(([l,v,c,s])=>`<div class="mc"><div class="mc-accent" style="background:${c}"></div><div class="mc-lbl">${l}</div><div class="mc-val" style="color:${c}">${v}</div><div class="mc-sub">${s}</div></div>`).join('')}</div>
    <div class="two-col" style="margin-bottom:14px;">
      <div class="card"><div class="card-hdr"><span class="card-title">OS por Tipo</span></div><div style="padding:14px;position:relative;height:190px;"><canvas id="pcm-c-tipo"></canvas></div><div id="pcm-leg-tipo" style="display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px;font-size:11px;color:var(--muted);"></div></div>
      <div class="card"><div class="card-hdr"><span class="card-title">OS por Linha</span></div><div style="padding:14px;position:relative;height:190px;"><canvas id="pcm-c-linha"></canvas></div></div>
    </div>
    <div class="two-col">
      <div class="card"><div class="card-hdr"><span class="card-title">Últimas OS</span></div><div id="pcm-dash-ultimas"><div class="loading">...</div></div></div>
      <div class="card"><div class="card-hdr"><span class="card-title">Preventivas — Próximos 7 dias</span></div><div id="pcm-dash-prev"><div class="loading">...</div></div></div>
    </div>`;

  // Gráficos
  const [tipoR, linhaR] = await Promise.all([apiCall('/api/pcm/dashboard/os-por-tipo'), apiCall('/api/pcm/dashboard/os-por-linha')]);
  const porTipo  = tipoR.ok  ? await tipoR.json()  : [];
  const porLinha = linhaR.ok ? await linhaR.json() : [];

  const tipoMap  = {'corretiva':'Corretiva','preventiva':'Preventiva','preditiva':'Preditiva','melhoria':'Melhoria'};
  const tipoClrs = ['#f97316','#38bdf8','#a78bfa','#22c55e'];
  const tipoLabels = porTipo.map(x=>tipoMap[x.tipo]||x.tipo||'Outro');
  const tipoData   = porTipo.map(x=>x.total);
  if (PCM_CHARTS.tipo) PCM_CHARTS.tipo.destroy();
  const ctxT = document.getElementById('pcm-c-tipo');
  if (ctxT && porTipo.length) {
    PCM_CHARTS.tipo = new Chart(ctxT,{type:'doughnut',data:{labels:tipoLabels,datasets:[{data:tipoData,backgroundColor:tipoClrs,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
    const total = tipoData.reduce((a,b)=>a+b,0);
    document.getElementById('pcm-leg-tipo').innerHTML = tipoLabels.map((l,i)=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${tipoClrs[i]};display:inline-block"></span>${l} ${total?Math.round(tipoData[i]/total*100):0}%</span>`).join('');
  }
  if (PCM_CHARTS.linha) PCM_CHARTS.linha.destroy();
  const ctxL = document.getElementById('pcm-c-linha');
  if (ctxL && porLinha.length) {
    PCM_CHARTS.linha = new Chart(ctxL,{type:'bar',data:{labels:porLinha.map(x=>x.linha||'N/A'),datasets:[{data:porLinha.map(x=>x.total),backgroundColor:'#38bdf8',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}}}});
  }

  // Últimas OS
  const osR = await apiCall('/api/pcm/os/?');
  const osList = osR.ok ? await osR.json() : [];
  document.getElementById('pcm-dash-ultimas').innerHTML = osList.length
    ? osList.slice(0,6).map(o=>`<div class="timeline-item"><div class="tl-dot" style="background:${o.tipo==='corretiva'||o.tipo==='Corretiva'?'#f97316':'#38bdf8'}"></div><div><div class="tl-title">${o.numero} — ${o.descricao||''}</div><div class="tl-meta">${fmtDate(o.data)} · ${o.linha||''} · ${statusBadge(o.status)}</div></div></div>`).join('')
    : '<div class="empty">Nenhuma OS encontrada</div>';

  // Preventivas próximas (vencendo ou vencidas)
  document.getElementById('pcm-dash-prev').innerHTML = prev7.length
    ? prev7.slice(0,6).map(p=>{
        const eq = PCM_EQUIPS.find(e=>e.id===p.equipamento_id);
        return `<div class="timeline-item"><div class="tl-dot" style="background:#22c55e"></div><div><div class="tl-title">${eq?eq.nome:'—'} — ${p.tipo}</div><div class="tl-meta">Prevista: ${fmtDate(p.proxima_execucao)}</div></div></div>`;
      }).join('')
    : '<div class="empty" style="padding:20px">Nenhuma preventiva vencendo ✓</div>';
}

let PCM_OS_ALL = [];
async function pcmRenderOSTable(busca='', tipo='', status='') {
  let url = '/api/pcm/os/';
  const r = await apiCall(url);
  PCM_OS_ALL = r.ok ? await r.json() : [];
  pcmFilterOS();
}

function pcmFilterOS() {
  const busca  = (document.getElementById('os-search')?.value||'').toLowerCase();
  const tipo   = document.getElementById('os-tipo')?.value||'';
  const status = document.getElementById('os-status-f')?.value||'';
  const isGestor = ME.role_pcm==='admin'||ME.role_pcm==='gestor'||ME.role_portal==='admin'||ME.role_portal==='superadmin';
  const filtered = PCM_OS_ALL.filter(o => {
    const mb = !busca || o.numero.toLowerCase().includes(busca)||o.descricao.toLowerCase().includes(busca)||(o.linha||'').toLowerCase().includes(busca);
    const mt = !tipo  || (o.tipo||'').toLowerCase()===tipo.toLowerCase();
    const ms = !status|| o.status===status;
    return mb&&mt&&ms;
  });
  const el = document.getElementById('os-table'); if(!el) return;
  el.innerHTML = filtered.length ? `<table><thead><tr><th>Nº</th><th>Data</th><th>Equipamento</th><th>Tipo</th><th>Descrição</th><th>Status</th><th>Ações</th></tr></thead><tbody>`+
    filtered.map(o => {
      const eq = PCM_EQUIPS.find(e=>e.id===o.equipamento_id);
      return `<tr><td><strong style="color:#0369a1">${o.numero}</strong></td><td style="white-space:nowrap">${fmtDate(o.data)}</td><td style="font-size:12px">${eq?eq.nome:'—'}</td><td>${typeBadge(o.tipo)}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${o.descricao}">${o.descricao}</td><td>${statusBadge(o.status)}</td><td style="display:flex;gap:5px"><button class="btn btn-s btn-sm" onclick="pcmEditOS(${o.id})">✏ Editar</button>${isGestor?`<button class="btn btn-danger btn-sm" onclick="pcmDeleteOS(${o.id},'${o.numero}')">✕</button>`:''}</td></tr>`;
    }).join('') + `</tbody></table>`
    : '<div class="empty">Nenhuma OS encontrada</div>';
}

async function pcmEditOS(id) {
  const r = await apiCall('/api/pcm/os/'+id);
  if (!r.ok) return;
  const o = await r.json();
  document.getElementById('os-modal-title').textContent = 'Editar OS — '+o.numero;
  document.getElementById('os-save-btn').textContent = 'Salvar Alterações';
  document.getElementById('os-edit-id').value = o.id;
  document.getElementById('os-num').value = o.numero;
  document.getElementById('os-data').value = o.data?o.data.toString().slice(0,10):'';
  document.getElementById('os-turno').value = o.turno||'Manhã';
  document.getElementById('os-equip').value = o.equipamento_id||'';
  document.getElementById('os-local').value = o.local||'';
  document.getElementById('os-tipo2').value = o.tipo||'Corretiva';
  document.getElementById('os-hi').value = o.hora_inicio||'';
  document.getElementById('os-hf').value = o.hora_fim||'';
  document.getElementById('os-desc').value = o.descricao||'';
  document.getElementById('os-mat').value = o.materiais||'';
  document.getElementById('os-causa').value = o.causa||'';
  document.getElementById('os-resp').value = o.responsavel_id||'';
  document.getElementById('os-stat').value = o.status==='aberta'?'Aberta':o.status==='em_andamento'?'Em andamento':o.status==='concluida'?'Concluída':'Cancelada';
  document.getElementById('os-obs').value = o.observacoes||'';
  openModal('m-os');
}

async function savePCMOS() {
  const id = document.getElementById('os-edit-id').value;
  const statMap = {'Aberta':'aberta','Em andamento':'em_andamento','Aguardando peça':'em_andamento','Concluída':'concluida','Cancelada':'cancelada'};
  const hi = document.getElementById('os-hi').value;
  const hf = document.getElementById('os-hf').value;
  let tempo = null;
  if (hi&&hf) { const [ah,am]=hi.split(':').map(Number); const [bh,bm]=hf.split(':').map(Number); tempo=Math.round(((bh*60+bm)-(ah*60+am))/6)/10; }
  const payload = {
    data: document.getElementById('os-data').value,
    turno: document.getElementById('os-turno').value||null,
    equipamento_id: parseInt(document.getElementById('os-equip').value)||null,
    local: document.getElementById('os-local').value||null,
    tipo: document.getElementById('os-tipo2').value,
    hora_inicio: hi||null, hora_fim: hf||null, tempo_total: tempo,
    descricao: document.getElementById('os-desc').value,
    materiais: document.getElementById('os-mat').value||null,
    causa: document.getElementById('os-causa').value||null,
    responsavel_id: parseInt(document.getElementById('os-resp').value)||null,
    status: statMap[document.getElementById('os-stat').value]||'aberta',
    observacoes: document.getElementById('os-obs').value||null,
  };
  if (!payload.descricao) { toast('Informe a descrição.',false); return; }
  try {
    if (id) { const r=await apiCall('/api/pcm/os/'+id,{method:'PUT',body:JSON.stringify(payload)}); if(!r.ok){const d=await r.json();throw new Error(d.detail);} toast('OS atualizada!'); }
    else    { const r=await apiCall('/api/pcm/os/',{method:'POST',body:JSON.stringify(payload)}); if(!r.ok){const d=await r.json();throw new Error(d.detail);} toast('OS criada!'); }
    closeModal('m-os'); pcmRenderOSTable(); pcmLoadDash();
  } catch(e) { toast(e.message,false); }
}

async function pcmDeleteOS(id, num) {
  confirmAction('Excluir OS','Remover '+num+'? Esta ação não pode ser desfeita.', async()=>{
    const r=await apiCall('/api/pcm/os/'+id,{method:'DELETE'}); if(!r.ok){const d=await r.json();toast(d.detail,false);return;} toast('OS removida.'); pcmRenderOSTable();
  });
}

function pcmRenderPrevTable(planos) {
  if (!planos.length) return '<div class="empty">Nenhum plano cadastrado</div>';
  const isGestor = ME.role_pcm==='admin'||ME.role_pcm==='gestor'||ME.role_portal==='admin'||ME.role_portal==='superadmin';
  return `<table><thead><tr><th>Equipamento</th><th>Tipo</th><th>Freq.</th><th>Próxima</th><th>Responsável</th><th>Ações</th></tr></thead><tbody>`+
    planos.map(p=>{
      const eq=PCM_EQUIPS.find(e=>e.id===p.equipamento_id);
      const u=PCM_USERS.find(u=>u.id===p.responsavel_id);
      const dt=p.proxima_execucao?new Date(p.proxima_execucao+' 12:00'):null;
      const venc=dt&&dt<new Date();
      return `<tr><td>${eq?eq.nome:'—'}</td><td>${p.tipo}</td><td>${p.frequencia_dias}d</td><td style="color:${venc?'#dc2626':'inherit'}">${dt?dt.toLocaleDateString('pt-BR'):'—'}</td><td>${u?u.nome:'—'}</td><td style="display:flex;gap:5px"><button class="btn btn-s btn-sm" onclick="pcmExecutarPrev(${p.id})">✓ Executar</button>${isGestor?`<button class="btn btn-s btn-sm" onclick="pcmEditPrev(${p.id})">✏ Editar</button><button class="btn btn-danger btn-sm" onclick="pcmDeletePrev(${p.id})">✕</button>`:''}</td></tr>`;
    }).join('') + `</tbody></table>`;
}

      </div>
      <div style="padding:10px 14px">
        ${e.fabricante?`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--muted)">Fabricante</span><span>${e.fabricante}</span></div>`:''}
        ${e.numero_serie?`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--muted)">Nº Série</span><span style="font-family:var(--mono)">${e.numero_serie}</span></div>`:''}
        ${e.local?`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--muted)">Local</span><span>${e.local}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px"><span style="color:var(--muted)">Criticidade</span>${critBadge(e.criticidade)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-s btn-sm" style="flex:1" onclick="pcmEditEquip(${e.id})">✏ Editar</button>
          <button class="btn btn-danger btn-sm" style="flex:1" onclick="pcmDeleteEquip(${e.id},'${e.nome.replace(/'/g,"\\'")}')">✕ Excluir</button>
        </div>
      </div>
    </div>`).join('')+`<div class="equip-card" style="border:1.5px dashed var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;min-height:160px;cursor:pointer" onclick="openModal('m-equip')"><div style="font-size:26px;color:var(--muted)">+</div><div style="font-size:12px;color:var(--muted)">Cadastrar equipamento</div></div>`;
}

async function savePCMEquip() {
  const linha=document.getElementById('eq-linha')?.value||'';
  const payload={codigo:document.getElementById('eq-cod').value,nome:document.getElementById('eq-nome').value,linha:linha,local:document.getElementById('eq-local').value||null,fabricante:document.getElementById('eq-fab').value||null,modelo:document.getElementById('eq-mod').value||null,numero_serie:document.getElementById('eq-ser').value||null,data_instalacao:document.getElementById('eq-dt').value||null,criticidade:document.getElementById('eq-crit').value,observacoes:document.getElementById('eq-obs').value||null};
  if (!payload.codigo||!payload.nome){toast('Preencha código e nome.',false);return;}
  try { const r=await apiCall('/api/pcm/equipamentos/',{method:'POST',body:JSON.stringify(payload)}); if(!r.ok){const d=await r.json();throw new Error(d.detail);} closeModal('m-equip'); toast('Equipamento cadastrado!'); await loadPCMMeta(); pcmLoadEquip(); } catch(e){toast(e.message,false);}
}

async function pcmEditEquip(id) {
  const e=PCM_EQUIPS.find(x=>x.id===id); if(!e) return;
  document.getElementById('eeq-id').value=e.id;
  document.getElementById('eeq-cod').value=e.codigo;
  document.getElementById('eeq-nome').value=e.nome;
  document.getElementById('eeq-local').value=e.local||'';
  document.getElementById('eeq-fab').value=e.fabricante||'';
  document.getElementById('eeq-mod').value=e.modelo||'';
  document.getElementById('eeq-ser').value=e.numero_serie||'';
  document.getElementById('eeq-crit').value=e.criticidade==='alta'?'Alta':e.criticidade==='media'?'Média':'Baixa';
  document.getElementById('eeq-obs').value=e.observacoes||'';
  document.getElementById('eeq-dt').value=e.data_instalacao?e.data_instalacao.toString().slice(0,10):'';
  populateLinhasSelects();
  setTimeout(()=>{ const el=document.getElementById('eeq-linha'); if(el) el.value=e.linha||''; },50);
  openModal('m-edit-equip');
}

async function savePCMEditEquip() {
  const id=document.getElementById('eeq-id').value;
  const payload={codigo:document.getElementById('eeq-cod').value.trim(),nome:document.getElementById('eeq-nome').value,linha:document.getElementById('eeq-linha')?.value||null,local:document.getElementById('eeq-local').value||null,fabricante:document.getElementById('eeq-fab').value||null,modelo:document.getElementById('eeq-mod').value||null,numero_serie:document.getElementById('eeq-ser').value||null,criticidade:document.getElementById('eeq-crit').value,observacoes:document.getElementById('eeq-obs').value||null,data_instalacao:document.getElementById('eeq-dt').value||null};
  try { const r=await apiCall('/api/pcm/equipamentos/'+id,{method:'PUT',body:JSON.stringify(payload)}); if(!r.ok){const d=await r.json();throw new Error(d.detail);} closeModal('m-edit-equip'); toast('Equipamento atualizado!'); await loadPCMMeta(); pcmLoadEquip(); } catch(e){toast(e.message,false);}
}

async function pcmDeleteEquip(id, nome) {
  confirmAction('Excluir Equipamento','Excluir "'+nome+'"? Esta ação não pode ser desfeita.', async()=>{
    const r=await apiCall('/api/pcm/equipamentos/'+id,{method:'DELETE'}); if(!r.ok){const d=await r.json();toast(d.detail,false);return;} toast(nome+' excluído.'); await loadPCMMeta(); pcmLoadEquip();
  });
}

/* PCM RELATÓRIOS */
async function pcmLoadRel() {
  const el=document.getElementById('pcm-s-rel'); if(!el) return;
  const [statsR, mensalR] = await Promise.all([apiCall('/api/pcm/dashboard/stats'), apiCall('/api/pcm/dashboard/os-mensais')]);
  const d=statsR.ok?await statsR.json():{};
  const mensal=mensalR.ok?await mensalR.json():[];
  el.innerHTML=`
    <div class="page-hdr"><div><div class="page-title">Relatórios</div><div class="page-sub">Indicadores e análises</div></div></div>
    <div class="metrics">${[
      ['MTTR',(d.mttr??0)+'h','#f97316','Tempo médio de reparo'],
      ['Taxa de conclusão',(d.taxa_conclusao??0)+'%','#22c55e','OS concluídas'],
      ['Total OS',d.total_os??0,'#a78bfa','Todas as ordens'],
      ['Equipamentos',d.equipamentos_ativos??0,'#38bdf8','Ativos'],
    ].map(([l,v,c,s])=>`<div class="mc"><div class="mc-accent" style="background:${c}"></div><div class="mc-lbl">${l}</div><div class="mc-val" style="color:${c}">${v}</div><div class="mc-sub">${s}</div></div>`).join('')}</div>
    <div class="two-col">
      <div class="card"><div class="card-hdr"><span class="card-title">OS por Mês</span></div><div style="padding:14px;position:relative;height:190px"><canvas id="pcm-c-mes"></canvas></div></div>
      <div class="card"><div class="card-hdr"><span class="card-title">Resumo do Período</span></div>
        <div style="padding:14px;font-size:13px;color:var(--muted);line-height:2.2">
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px"><span>Total de OS</span><strong style="color:var(--text)">${d.total_os??0}</strong></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px"><span>OS Concluídas</span><strong style="color:#22c55e">${d.os_concluidas??0}</strong></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px"><span>OS Abertas</span><strong style="color:#f59e0b">${d.os_abertas??0}</strong></div>
          <div style="display:flex;justify-content:space-between"><span>Preventivas vencidas</span><strong style="color:#ef4444">${d.preventivas_vencidas??0}</strong></div>
        </div>
      </div>
    </div>`;
  if (mensal.length) {
    if (PCM_CHARTS.mes) PCM_CHARTS.mes.destroy();
    PCM_CHARTS.mes = new Chart(document.getElementById('pcm-c-mes'),{type:'bar',data:{labels:mensal.map(x=>x.label),datasets:[{data:mensal.map(x=>x.total),backgroundColor:'#38bdf8',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}}}});
  }
}

/* PCM CONFIGURAÇÕES */
const LINHAS_DEFAULT=['Linha 1 - Sachê','Linha 2 - Sachê','Linha 3 - Sachê','Linha 4 - Sachê','Linha 5 - Cartucho','Área Geral'];
function getLinhas(){try{return JSON.parse(localStorage.getItem('pcm_linhas')||'null')||LINHAS_DEFAULT;}catch{return LINHAS_DEFAULT;}}
function saveLinhas(l){localStorage.setItem('pcm_linhas',JSON.stringify(l));}
function getLinhasOptions(){return getLinhas().map(l=>`<option value="${l}">${l}</option>`).join('');}
function populateLinhasSelects(){
  const opts=getLinhasOptions();
  ['os-equip-linha','eq-linha','eeq-linha'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=opts;});
}

async function pcmLoadConfig() {
  const el=document.getElementById('pcm-s-config'); if(!el) return;
  const linhas=getLinhas();
  el.innerHTML=`
    <div class="page-hdr"><div><div class="page-title">Configurações</div><div class="page-sub">Gerencie linhas, áreas e parâmetros</div></div></div>
    <div class="two-col">
      <div class="card">
        <div class="card-hdr"><span class="card-title">Linhas e Áreas</span><button class="btn btn-p btn-sm" onclick="openNovaLinha()">+ Adicionar</button></div>
        <div id="linhas-list" style="padding:6px 0">${linhas.map((l,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block"></span><span style="font-size:13px">${l}</span></div><div style="display:flex;gap:5px"><button class="btn btn-s btn-sm" onclick="editLinha(${i})">✏</button><button class="btn btn-danger btn-sm" onclick="deleteLinha(${i})">✕</button></div></div>`).join('')}</div>
      </div>
      <div class="card">
        <div class="card-hdr"><span class="card-title">Informações do Sistema</span></div>
        <div style="padding:14px;font-size:13px;color:var(--muted);line-height:2.2">
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px"><span>Versão</span><strong style="color:var(--text)">PCM v2.0</strong></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px"><span>Empresa</span><strong style="color:var(--text)">Qualimpel Indústria Química</strong></div>
          <div style="display:flex;justify-content:space-between"><span>Usuário</span><strong style="color:var(--text)">${ME.nome}</strong></div>
        </div>
      </div>
    </div>`;
}

function openNovaLinha(){document.getElementById('linha-modal-title').textContent='Nova Linha / Área';document.getElementById('linha-edit-idx').value='';document.getElementById('linha-nome').value='';openModal('m-nova-linha');}
function editLinha(idx){const l=getLinhas();document.getElementById('linha-modal-title').textContent='Editar Linha / Área';document.getElementById('linha-edit-idx').value=idx;document.getElementById('linha-nome').value=l[idx];openModal('m-nova-linha');}
function deleteLinha(idx){const l=getLinhas();if(!confirm('Excluir "'+l[idx]+'"?'))return;l.splice(idx,1);saveLinhas(l);pcmLoadConfig();populateLinhasSelects();toast('Linha removida.');}
function salvarLinha(){const nome=document.getElementById('linha-nome').value.trim();if(!nome){toast('Digite o nome.',false);return;}const l=getLinhas();const idx=document.getElementById('linha-edit-idx').value;if(idx!=='')l[parseInt(idx)]=nome;else l.push(nome);saveLinhas(l);closeModal('m-nova-linha');pcmLoadConfig();populateLinhasSelects();toast('Linha salva!');}

/* ══════════════════════════════════════════════════════════════
   ADMIN USUÁRIOS
══════════════════════════════════════════════════════════════ */
async function renderAdminUsers() {
  const mc=document.getElementById('main-content');
  mc.innerHTML='<div class="loading">Carregando usuários...</div>';
  const r=await apiCall('/api/users/');
  if(!r.ok){mc.innerHTML='<div class="empty">Erro ao carregar.</div>';return;}
  USERS_CACHE=await r.json();
  renderUsersTable(USERS_CACHE);
}

function renderUsersTable(users) {
  const mc=document.getElementById('main-content');
  const isAdmin=ME.role_portal==='admin'||ME.role_portal==='superadmin';
  mc.innerHTML=`
    <div class="page-hdr"><div class="page-title">Usuários do Sistema</div>${isAdmin?`<button class="btn btn-p" onclick="openUserModal()">+ Novo Usuário</button>`:''}</div>
    <div class="admin-wrap">
      <div class="admin-search"><input type="text" placeholder="Buscar por nome, e-mail ou cargo..." oninput="filterAdminUsers(this.value)"/></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Perfil</th><th>Módulos</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="users-tbody">${renderUserRows(users)}</tbody>
      </table></div>
    </div>`;
}

function renderUserRows(users) {
  if(!users.length) return `<tr><td colspan="7"><div class="empty">Nenhum usuário encontrado.</div></td></tr>`;
  const roleMap={superadmin:'bp',admin:'br',usuario:'bgy'};
  const roleLabel={superadmin:'Superadmin',admin:'Admin',usuario:'Usuário'};
  return users.map(u=>{
    const pills=MODULES.filter(m=>u[m.acesso]).map(m=>`<span class="mpill">${m.label}</span>`).join('');
    const canEdit=ME.role_portal==='superadmin'||(u.role_portal!=='superadmin');
    const canDel=u.id!==ME.id&&(ME.role_portal==='superadmin'||u.role_portal!=='superadmin');
    return `<tr>
      <td><strong>${u.nome}</strong>${u.matricula?`<br><span style="font-size:11px;color:var(--muted)">Matr. ${u.matricula}</span>`:''}</td>
      <td style="color:var(--muted)">${u.email}</td>
      <td style="color:var(--muted)">${u.cargo||'—'}</td>
      <td><span class="badge ${roleMap[u.role_portal]||'bgy'}">${roleLabel[u.role_portal]||u.role_portal}</span></td>
      <td><div class="mod-pills">${pills||'<span style="font-size:11px;color:var(--muted)">Nenhum</span>'}</div></td>
      <td><span class="badge ${u.is_active?'bg':'br'}">${u.is_active?'Ativo':'Inativo'}</span></td>
      <td style="display:flex;gap:5px">
        ${canEdit?`<button class="btn btn-s btn-sm" onclick='openUserModal(${JSON.stringify(u)})'>✏ Editar</button>`:''}
        <button class="btn btn-s btn-sm" onclick="adminResetPwd(${u.id},'${u.nome.split(' ')[0]}')">🔑</button>
        ${canDel?`<button class="btn btn-danger btn-sm" onclick="adminDeleteUser(${u.id},'${u.nome.split(' ')[0]}')">✕</button>`:''}
      </td>
    </tr>`;
  }).join('');
}

function filterAdminUsers(q) {
  const t=q.toLowerCase();
  const f=USERS_CACHE.filter(u=>u.nome.toLowerCase().includes(t)||u.email.toLowerCase().includes(t)||(u.cargo||'').toLowerCase().includes(t));
  document.getElementById('users-tbody').innerHTML=renderUserRows(f);
}

function openUserModal(user=null) {
  document.getElementById('modal-user-title').textContent=user?'Editar Usuário':'Novo Usuário';
  document.getElementById('u-id').value=user?user.id:'';
  document.getElementById('u-nome').value=user?user.nome:'';
  document.getElementById('u-email').value=user?user.email:'';
  document.getElementById('u-senha').value='';
  document.getElementById('u-matricula').value=user?(user.matricula||''):'';
  document.getElementById('u-cargo').value=user?(user.cargo||''):'';
  document.getElementById('u-tel').value=user?(user.telefone||''):'';
  document.getElementById('u-role').value=user?user.role_portal:'usuario';
  document.getElementById('u-ativo').value=user?String(user.is_active):'true';
  document.getElementById('u-senha-hint').style.display=user?'inline':'none';
  // Permissões
  document.getElementById('perm-grid').innerHTML=MODULES.map(m=>`
    <div class="perm-row">
      <div class="perm-left">
        <label class="toggle"><input type="checkbox" id="perm-${m.key}" ${user&&user[m.acesso]?'checked':''} onchange="togglePermRole('${m.key}')"/><span class="slider"></span></label>
        <span class="perm-label">${m.icon} ${m.label}</span>
      </div>
      <select class="perm-role" id="prole-${m.key}" ${!(user&&user[m.acesso])?'disabled':''}>
        <option value="admin" ${user&&user['role_'+m.key]==='admin'?'selected':''}>Admin</option>
        <option value="gestor" ${user&&user['role_'+m.key]==='gestor'?'selected':''}>Gestor</option>
        <option value="tecnico" ${!user||user['role_'+m.key]==='tecnico'||!user['role_'+m.key]?'selected':''}>Técnico</option>
      </select>
    </div>`).join('');
  openModal('modal-user');
}

function togglePermRole(key) { document.getElementById('prole-'+key).disabled=!document.getElementById('perm-'+key).checked; }

async function saveUser() {
  const id=document.getElementById('u-id').value;
  const senha=document.getElementById('u-senha').value;
  const body={nome:document.getElementById('u-nome').value.trim(),email:document.getElementById('u-email').value.trim(),matricula:document.getElementById('u-matricula').value.trim()||null,cargo:document.getElementById('u-cargo').value.trim()||null,telefone:document.getElementById('u-tel').value.trim()||null,role_portal:document.getElementById('u-role').value,is_active:document.getElementById('u-ativo').value==='true'};
  MODULES.forEach(m=>{body['acesso_'+m.key]=document.getElementById('perm-'+m.key).checked;body['role_'+m.key]=document.getElementById('prole-'+m.key).value||null;});
  if (!body.nome||!body.email){toast('Preencha nome e e-mail.',false);return;}
  if (!id){if(!senha||senha.length<6){toast('Informe uma senha com ao menos 6 caracteres.',false);return;}body.senha=senha;}
  try {
    const url=id?'/api/users/'+id:'/api/users/';
    const r=await apiCall(url,{method:id?'PUT':'POST',body:JSON.stringify(body)});
    const data=await r.json(); if(!r.ok) throw new Error(data.detail||'Erro ao salvar.');
    toast(id?'Usuário atualizado!':'Usuário criado!'); closeModal('modal-user'); renderAdminUsers();
  } catch(e){toast(e.message,false);}
}

async function adminResetPwd(id,nome) {
  confirmAction('Redefinir Senha','A senha de '+nome+' será redefinida para "qualimpel123". Confirma?', async()=>{
    const r=await apiCall('/api/users/'+id+'/reset-password',{method:'POST'});
    const d=await r.json(); toast(r.ok?d.message:d.detail,r.ok);
  });
}

async function adminDeleteUser(id,nome) {
  confirmAction('Excluir Usuário','Excluir "'+nome+'"? Esta ação não pode ser desfeita.', async()=>{
    const r=await apiCall('/api/users/'+id,{method:'DELETE'});
    if(!r.ok){const d=await r.json();toast(d.detail,false);return;} toast('Usuário excluído.'); renderAdminUsers();
  });
}

/* MINHA CONTA */
function loadContaInfo() {
  if(!ME) return;
  document.getElementById('conta-avatar').textContent=initials(ME.nome);
  document.getElementById('conta-nome').textContent=ME.nome;
  document.getElementById('conta-email').textContent=ME.email;
  document.getElementById('cp-atual').value='';
  document.getElementById('cp-nova').value='';
  document.getElementById('cp-conf').value='';
}
async function changePassword() {
  const atual=document.getElementById('cp-atual').value;
  const nova=document.getElementById('cp-nova').value;
  const conf=document.getElementById('cp-conf').value;
  if(!atual||!nova||!conf){toast('Preencha todos os campos.',false);return;}
  if(nova.length<6){toast('Nova senha deve ter pelo menos 6 caracteres.',false);return;}
  if(nova!==conf){toast('As senhas não coincidem.',false);return;}
  try {
    const r=await apiCall('/api/auth/change-password',{method:'POST',body:JSON.stringify({senha_atual:atual,nova_senha:nova})});
    const data=await r.json(); if(!r.ok) throw new Error(data.detail||'Erro ao alterar senha.');
    closeConta(); toast('Senha alterada com sucesso!');
  } catch(e){toast(e.message,false);}
}
